<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap');
    text { font-family: 'Inter', system-ui, sans-serif; }
    .title    { font-size: 32px; font-weight: 800; fill: #FFFFFF; }
    .subtitle { font-size: 15px; font-weight: 400; fill: #8E8E93; }
    .header   { font-size: 14px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.05em; text-transform: uppercase; }
    .node-t   { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
    .node-d   { font-size: 13px; font-weight: 400; fill: #C7C7CC; }
    .badge    { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
  </style>
  <defs>
    <!-- Dark gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    
    <!-- Node Gradients -->
    <linearGradient id="gradCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#005BBB"/>
      <stop offset="100%" stop-color="#5856D6"/>
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#28A745"/>
      <stop offset="100%" stop-color="#34C759"/>
    </linearGradient>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#E6730A"/>
      <stop offset="100%" stop-color="#FF9F0A"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Markers -->
    <marker id="arr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8E8E93"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#34C759"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#007AFF"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Title -->
  <text x="640" y="60" class="title" text-anchor="middle">Model Retraining Process (train_absa_model.py)</text>
  <text x="640" y="85" class="subtitle" text-anchor="middle">Fine-tuning DeBERTa v3 on heavily imbalanced aspect-sentiment data</text>

  <!-- ─── Columns / Background zones ─── -->
  <rect x="40" y="140" width="360" height="520" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
  <text x="220" y="175" class="header" text-anchor="middle">1. Data Preparation</text>

  <rect x="420" y="140" width="440" height="520" rx="16" fill="rgba(0,122,255,0.03)" stroke="rgba(0,122,255,0.15)"/>
  <text x="640" y="175" class="header" fill="#7AB7FF" text-anchor="middle">2. Weighted Training Strategy</text>

  <rect x="880" y="140" width="360" height="520" rx="16" fill="rgba(52,199,89,0.03)" stroke="rgba(52,199,89,0.15)"/>
  <text x="1060" y="175" class="header" fill="#34C759" text-anchor="middle">3. Post-Training &amp; Telemetry</text>

  <!-- ─── Lines between nodes ─── -->
  <!-- Col 1 -->
  <path d="M 220 280 L 220 310" stroke="#8E8E93" stroke-width="2" marker-end="url(#arr1)"/>
  <path d="M 220 390 L 220 420" stroke="#8E8E93" stroke-width="2" marker-end="url(#arr1)"/>
  <path d="M 220 500 L 220 530" stroke="#8E8E93" stroke-width="2" marker-end="url(#arr1)"/>

  <!-- Col 1 to 2 -->
  <path d="M 360 480 Q 400 480 430 460" stroke="#8E8E93" stroke-width="2" fill="none" marker-end="url(#arr1)"/>

  <!-- Col 2 -->
  <path d="M 640 280 L 640 310" stroke="#007AFF" stroke-width="2" marker-end="url(#arrB)"/>
  <path d="M 640 390 L 640 420" stroke="#007AFF" stroke-width="2" marker-end="url(#arrB)"/>
  <path d="M 640 500 L 640 530" stroke="#007AFF" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- Col 2 to 3 -->
  <path d="M 800 480 Q 840 480 870 460" stroke="#007AFF" stroke-width="2" fill="none" marker-end="url(#arrB)"/>

  <!-- Col 3 -->
  <path d="M 1060 280 L 1060 310" stroke="#34C759" stroke-width="2" marker-end="url(#arrG)"/>
  <path d="M 1060 390 L 1060 420" stroke="#34C759" stroke-width="2" marker-end="url(#arrG)"/>
  <!-- ───────────────────────── -->


  <!-- ─── NODE 1.1: Load & Deduplicate ─── -->
  <g filter="url(#shadow)">
    <rect x="80" y="200" width="280" height="80" rx="12" fill="url(#gradCard)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="220" y="234" class="node-t" text-anchor="middle">Load &amp; Deduplicate</text>
    <text x="220" y="254" class="node-d" text-anchor="middle">absa_training_dataset.csv</text>
    <text x="220" y="269" class="node-d" font-size="11" fill="#8E8E93" text-anchor="middle">Drops exact (text, aspect) pairs</text>
  </g>

  <!-- ─── NODE 1.2: Clean Labels ─── -->
  <g filter="url(#shadow)">
    <rect x="80" y="310" width="280" height="80" rx="12" fill="url(#gradCard)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="220" y="344" class="node-t" text-anchor="middle">Filter Labels</text>
    <text x="220" y="364" class="node-d" text-anchor="middle">Strictly: Pos, Neg, Neutral</text>
    <text x="220" y="379" class="node-d" font-size="11" fill="#8E8E93" text-anchor="middle">Removes corrupt rows</text>
  </g>

  <!-- ─── NODE 1.3: Compute Weights ─── -->
  <g filter="url(#shadow)">
    <rect x="80" y="420" width="280" height="80" rx="12" fill="url(#gradOrange)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="220" y="454" class="node-t" text-anchor="middle">Compute Class Weights</text>
    <text x="220" y="474" class="node-d" text-anchor="middle">sklearn compute_class_weight</text>
    <text x="220" y="489" class="node-d" font-size="11" fill="#FFCF87" text-anchor="middle">Solves ~78% Positive dataset bias</text>
  </g>

  <!-- ─── NODE 1.4: Stratified Split ─── -->
  <g filter="url(#shadow)">
    <rect x="80" y="530" width="280" height="80" rx="12" fill="url(#gradCard)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="220" y="564" class="node-t" text-anchor="middle">Stratified Split &amp; Tokenize</text>
    <text x="220" y="584" class="node-d" text-anchor="middle">80/20 Train/Val Split</text>
    <text x="220" y="599" class="node-d" font-size="11" fill="#8E8E93" text-anchor="middle">Pairs: [Text] + [Aspect]</text>
  </g>


  <!-- ─── NODE 2.1: Custom WeightedTrainer ─── -->
  <g filter="url(#shadow)">
    <rect x="480" y="200" width="320" height="80" rx="12" fill="url(#gradBlue)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="640" y="234" class="node-t" text-anchor="middle">WeightedTrainer (Custom)</text>
    <text x="640" y="254" class="node-d" fill="#D6E4FF" text-anchor="middle">Overrides HuggingFace compute_loss()</text>
    <text x="640" y="269" class="node-d" font-size="11" fill="#A1C6FF" text-anchor="middle">Applies reverse class weights to CrossEntropyLoss</text>
  </g>

  <!-- ─── NODE 2.2: LiveMetrics Hook ─── -->
  <g filter="url(#shadow)">
    <rect x="480" y="310" width="320" height="80" rx="12" fill="url(#gradCard)" stroke="#007AFF" stroke-width="1.5"/>
    <text x="640" y="344" class="node-t" fill="#7AB7FF" text-anchor="middle">LiveMetricsCallback</text>
    <text x="640" y="364" class="node-d" text-anchor="middle">Intercepts end of every epoch</text>
    <text x="640" y="379" class="node-d" font-size="11" fill="#8E8E93" text-anchor="middle">Writes live_training_metrics.json for Dashboards</text>
  </g>

  <!-- ─── NODE 2.3: DeBERTa Engine ─── -->
  <g filter="url(#shadow)">
    <rect x="480" y="420" width="320" height="80" rx="12" fill="url(#gradCard)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="640" y="454" class="node-t" text-anchor="middle">8 Epoch Training Loop</text>
    <text x="640" y="474" class="node-d" text-anchor="middle">Batch: 16 | Warmup: 200 | WD: 0.01</text>
    <text x="640" y="489" class="node-d" font-size="11" fill="#8E8E93" text-anchor="middle">Base: unknownexplosion/SentimentAnalysisog</text>
  </g>

  <!-- ─── NODE 2.4: Best Model Metric ─── -->
  <g filter="url(#shadow)">
    <rect x="480" y="530" width="320" height="80" rx="12" fill="url(#gradCard)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="640" y="564" class="node-t" text-anchor="middle">Load Best Model by F1</text>
    <text x="640" y="584" class="node-d" text-anchor="middle">load_best_model_at_end=True</text>
    <text x="640" y="599" class="node-d" font-size="11" fill="#8E8E93" text-anchor="middle">Prioritizes F1-Score over raw Accuracy</text>
  </g>


  <!-- ─── NODE 3.1: Save Artifacts ─── -->
  <g filter="url(#shadow)">
    <rect x="920" y="200" width="280" height="80" rx="12" fill="url(#gradCard)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="1060" y="234" class="node-t" text-anchor="middle">Save Local Artifacts</text>
    <text x="1060" y="254" class="node-d" text-anchor="middle">fine_tuned_absa_model/</text>
    <text x="1060" y="269" class="node-d" font-size="11" fill="#8E8E93" text-anchor="middle">Saves Model Weights + Tokenizer</text>
  </g>

  <!-- ─── NODE 3.2: Final Eval ─── -->
  <g filter="url(#shadow)">
    <rect x="920" y="310" width="280" height="80" rx="12" fill="url(#gradGreen)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="1060" y="344" class="node-t" text-anchor="middle">Final Evaluation Run</text>
    <text x="1060" y="364" class="node-d" fill="#E5F9E7" text-anchor="middle">Computes Acc, F1, Precision</text>
    <text x="1060" y="379" class="node-d" font-size="11" fill="#A8E6A1" text-anchor="middle">Writes persistent metrics.json</text>
  </g>

  <!-- ─── NODE 3.3: Cleanup ─── -->
  <g filter="url(#shadow)">
    <rect x="920" y="420" width="280" height="80" rx="12" fill="url(#gradCard)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="1060" y="454" class="node-t" text-anchor="middle">Cleanup Telemetry</text>
    <text x="1060" y="474" class="node-d" text-anchor="middle">Purge live_training_metrics.json</text>
    <text x="1060" y="489" class="node-d" font-size="11" fill="#8E8E93" text-anchor="middle">Signals Streamlit that training is done</text>
  </g>

</svg>
