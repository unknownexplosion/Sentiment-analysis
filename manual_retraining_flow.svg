<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap');
    text { font-family: 'Inter', system-ui, sans-serif; }
    .title    { font-size: 30px; font-weight: 800; fill: #FFFFFF; }
    .subtitle { font-size: 14px; font-weight: 400; fill: #8E8E93; }
    .node-t   { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .node-d   { font-size: 12px; font-weight: 400; fill: #C7C7CC; }
    .badge    { font-size: 10px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.05em; text-transform: uppercase; }
    .edge-lbl { font-size: 12px; font-weight: 600; fill: #8E8E93; }
  </style>
  
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- UI Card Gradient -->
    <linearGradient id="gradUI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Action Gradient (Blue) -->
    <linearGradient id="gradAction" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#5856D6"/>
    </linearGradient>

    <!-- Data Gradient (Orange) -->
    <linearGradient id="gradData" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6730A"/>
      <stop offset="100%" stop-color="#FF9F0A"/>
    </linearGradient>

    <!-- Success Gradient (Green) -->
    <linearGradient id="gradSuccess" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28A745"/>
      <stop offset="100%" stop-color="#34C759"/>
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8E8E93"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#34C759"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Title -->
  <text x="640" y="60" class="title" text-anchor="middle">Manual Retraining Workflow</text>
  <text x="640" y="85" class="subtitle" text-anchor="middle">The end-to-end journey from Button Click to Cloud Deployment</text>

  <!-- Flow Paths -->
  <g stroke="#8E8E93" stroke-width="2" fill="none">
    <path d="M 180 360 L 230 360" marker-end="url(#arrow)"/>
    <path d="M 430 360 L 480 360" marker-end="url(#arrow)"/>
    <path d="M 680 360 L 730 360" marker-end="url(#arrow)"/>
    <path d="M 930 360 L 980 360" marker-end="url(#arrow)"/>
    
    <!-- Path to Deployment -->
    <path d="M 1130 310 C 1130 250, 1160 210, 1190 210" marker-end="url(#arrow)"/>
    <!-- Path to Skip -->
    <path d="M 1130 410 C 1130 470, 1160 510, 1190 510" marker-end="url(#arrow)"/>

    <!-- Data feed into training -->
    <path d="M 600 210 Q 600 250, 710 320" stroke="#FF9F0A" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  </g>

  <!-- Step 1: User Action -->
  <g filter="url(#shadow)">
    <rect x="30" y="310" width="150" height="100" rx="12" fill="url(#gradUI)" stroke="rgba(255,255,255,0.1)"/>
    <text x="105" y="340" class="badge" fill="#A1A1AA" text-anchor="middle">Step 1</text>
    <text x="105" y="365" class="node-t" text-anchor="middle">Button Click</text>
    <text x="105" y="385" class="node-d" text-anchor="middle">Run Retraining Now</text>
  </g>

  <!-- Step 2: Fresh Scrape -->
  <g filter="url(#shadow)">
    <rect x="230" y="310" width="200" height="100" rx="12" fill="url(#gradAction)" stroke="rgba(255,255,255,0.2)"/>
    <text x="330" y="340" class="badge" fill="#D6E4FF" text-anchor="middle">Step 2</text>
    <text x="330" y="365" class="node-t" text-anchor="middle">Fresh Scrape</text>
    <text x="330" y="385" class="node-d" text-anchor="middle">Grabs latest Reddit posts</text>
  </g>

  <!-- Step 3: Cleanup & Merge -->
  <g filter="url(#shadow)">
    <rect x="480" y="310" width="200" height="100" rx="12" fill="url(#gradAction)" stroke="rgba(255,255,255,0.2)"/>
    <text x="580" y="340" class="badge" fill="#D6E4FF" text-anchor="middle">Step 3</text>
    <text x="580" y="365" class="node-t" text-anchor="middle">Process &amp; Merge</text>
    <text x="580" y="385" class="node-d" text-anchor="middle">Cleans labels &amp; appends</text>
  </g>

  <!-- Master Dataset (The Reservoir) -->
  <g filter="url(#shadow)">
    <rect x="480" y="150" width="200" height="60" rx="30" fill="url(#gradData)" stroke="rgba(255,255,255,0.2)"/>
    <text x="580" y="175" class="node-t" text-anchor="middle">ABSA Master Dataset</text>
    <text x="580" y="195" class="node-d" fill="#000" text-anchor="middle">absa_training_dataset.csv</text>
  </g>

  <!-- Step 4: Full Retraining -->
  <g filter="url(#shadow)">
    <rect x="730" y="310" width="200" height="100" rx="12" fill="url(#gradAction)" stroke="rgba(255,255,255,0.2)"/>
    <text x="830" y="340" class="badge" fill="#D6E4FF" text-anchor="middle">Step 4</text>
    <text x="830" y="365" class="node-t" text-anchor="middle">Full Retraining</text>
    <text x="830" y="385" class="node-d" text-anchor="middle">Trains on 100% of data</text>
  </g>

  <!-- Step 5: Gatekeeper -->
  <g filter="url(#shadow)">
    <rect x="980" y="310" width="150" height="100" rx="12" fill="url(#gradData)" stroke="rgba(255,255,255,0.2)"/>
    <text x="1055" y="340" class="badge" fill="#FFCF87" text-anchor="middle">Step 5</text>
    <text x="1055" y="365" class="node-t" text-anchor="middle">Metric Gate</text>
    <text x="1055" y="385" class="node-d" text-anchor="middle">Check F1 Improvement</text>
  </g>

  <!-- Outcome 1: Deploy -->
  <g filter="url(#shadow)">
    <rect x="1080" y="160" width="180" height="80" rx="12" fill="url(#gradSuccess)" stroke="rgba(255,255,255,0.2)"/>
    <text x="1170" y="190" class="node-t" text-anchor="middle">Deploy to Cloud</text>
    <text x="1170" y="210" class="node-d" font-weight="600" fill="#E5F9E7" text-anchor="middle">✅ Hugging Face Push</text>
  </g>

  <!-- Outcome 2: Reject -->
  <g filter="url(#shadow)">
    <rect x="1080" y="480" width="180" height="80" rx="12" fill="rgba(255,59,48,0.2)" stroke="#FF3B30"/>
    <text x="1170" y="510" class="node-t" fill="#FF3B30" text-anchor="middle">Discard Challenger</text>
    <text x="1170" y="530" class="node-d" fill="#FF3B30" text-anchor="middle">❌ Keep Existing Model</text>
  </g>

  <!-- Labels -->
  <text x="1135" y="270" class="edge-lbl" fill="#34C759">F1 Improved</text>
  <text x="1135" y="450" class="edge-lbl" fill="#FF3B30">Regressed</text>
  <text x="490" y="260" class="edge-lbl" fill="#FF9F0A">Merge New + Old</text>

</svg>
