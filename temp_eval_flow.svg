<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap');
    text { font-family: 'Inter', system-ui, sans-serif; }
    .title    { font-size: 28px; font-weight: 800; fill: #FFFFFF; }
    .subtitle { font-size: 14px; font-weight: 400; fill: #8E8E93; }
    .node-t   { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .node-d   { font-size: 12px; font-weight: 400; fill: #C7C7CC; }
    .badge    { font-size: 10px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.05em; text-transform: uppercase; }
  </style>
  
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005BBB"/>
      <stop offset="100%" stop-color="#5856D6"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6730A"/>
      <stop offset="100%" stop-color="#FF9F0A"/>
    </linearGradient>
    <linearGradient id="gGray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B22222"/>
      <stop offset="100%" stop-color="#FF3B30"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28A745"/>
      <stop offset="100%" stop-color="#34C759"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8E8E93"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#34C759"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Strings / Labels -->
  <text x="640" y="70" class="title" text-anchor="middle">Hugging Face Checkpoints &amp; Directory Flow</text>
  <text x="640" y="95" class="subtitle" text-anchor="middle">Demystifying outputs/temp_eval vs. outputs/fine_tuned_absa_model</text>

  <!-- BACKGROUND LANES -->
  <!-- Top Lane: Helper Script -->
  <rect x="50" y="160" width="1180" height="200" rx="16" fill="rgba(88,86,214,0.05)" stroke="rgba(88,86,214,0.2)"/>
  <text x="70" y="190" class="badge" fill="#8B5CF6">Helper / Evaluation Script Only</text>

  <!-- Bottom Lane: Real Retraining Base -->
  <rect x="50" y="420" width="1180" height="240" rx="16" fill="rgba(52,199,89,0.05)" stroke="rgba(52,199,89,0.2)"/>
  <text x="70" y="445" class="badge" fill="#34C759">Main "Run Retraining" Button Workflow</text>


  <!-- CENTRAL DATA SOURCE -->
  <g filter="url(#shadow)">
    <rect x="-100" y="315" width="220" height="90" rx="16" fill="url(#gOrange)" stroke="rgba(255,255,255,0.2)" transform="translate(180, 0)"/>
    <text x="190" y="355" class="node-t" text-anchor="middle">absa_training_</text>
    <text x="190" y="375" class="node-t" text-anchor="middle">dataset.csv</text>
    <text x="190" y="392" class="node-d" text-anchor="middle">The One Source of Truth</text>
  </g>


  <!-- PATHWAYS -->
  <!-- Path UP to test_baseline.py -->
  <path d="M 290 320 C 350 260, 350 260, 420 260" stroke="#8E8E93" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- Path DOWN to train_absa_model.py -->
  <path d="M 290 400 C 350 540, 350 540, 420 540" stroke="#34C759" stroke-width="2" fill="none" marker-end="url(#arrowG)"/>

  <path d="M 640 260 L 710 260" stroke="#8E8E93" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 640 540 L 710 540" stroke="#34C759" stroke-width="2" fill="none" marker-end="url(#arrowG)"/>
  <path d="M 930 540 L 1000 540" stroke="#34C759" stroke-width="2" fill="none" marker-end="url(#arrowG)"/>


  <!-- TOP LANE NODES -->
  <g filter="url(#shadow)">
    <rect x="420" y="210" width="220" height="100" rx="16" fill="url(#gGray)" stroke="rgba(255,255,255,0.2)"/>
    <text x="530" y="245" class="badge" fill="#C7C7CC" text-anchor="middle">Test Script</text>
    <text x="530" y="270" class="node-t" text-anchor="middle">test_baseline.py</text>
    <text x="530" y="290" class="node-d" text-anchor="middle">Never executes on button click.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="710" y="210" width="220" height="100" rx="16" fill="url(#gRed)" stroke="rgba(255,59,48,0.5)"/>
    <text x="820" y="245" class="badge" fill="#FFCF87" text-anchor="middle">Scratch Folder</text>
    <text x="820" y="270" class="node-t" text-anchor="middle">outputs/temp_eval/</text>
    <text x="820" y="290" class="node-d" text-anchor="middle">Required by HuggingFace Trainer.</text>
    <text x="820" y="303" class="node-d" fill="#FFCF87" text-anchor="middle">Safely ignorable trash folder.</text>
  </g>

  <!-- BOTTOM LANE NODES -->
  <g filter="url(#shadow)">
    <rect x="420" y="490" width="220" height="100" rx="16" fill="url(#gBlue)" stroke="rgba(255,255,255,0.2)"/>
    <text x="530" y="525" class="badge" fill="#D6E4FF" text-anchor="middle">Execute Retraining Button</text>
    <text x="530" y="550" class="node-t" text-anchor="middle">train_absa_model.py</text>
    <text x="530" y="570" class="node-d" text-anchor="middle">The actual neural networking code.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="710" y="490" width="220" height="100" rx="16" fill="url(#gGreen)" stroke="rgba(52,199,89,0.5)"/>
    <text x="820" y="525" class="badge" fill="#E5F9E7" text-anchor="middle">The Real Artifacts Output</text>
    <text x="820" y="550" class="node-t" text-anchor="middle">fine_tuned_absa_model/</text>
    <text x="820" y="570" class="node-d" text-anchor="middle">Permanently saves model weights,</text>
    <text x="820" y="583" class="node-d" text-anchor="middle">tokenizer, &amp; metrics.json.</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="1000" y="490" width="220" height="100" rx="16" fill="url(#gGreen)" stroke="rgba(52,199,89,0.5)"/>
    <text x="1110" y="525" class="badge" fill="#E5F9E7" text-anchor="middle">Cloud</text>
    <text x="1110" y="550" class="node-t" text-anchor="middle">Hugging Face Hub</text>
    <text x="1110" y="570" class="node-d" text-anchor="middle">Pushed live if performance improved</text>
  </g>

</svg>
